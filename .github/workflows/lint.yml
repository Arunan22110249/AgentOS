name: Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install -r requirements.txt
      
      - name: Format check with black
        run: black --check backend tests
      
      - name: Import sort check
        run: isort --check-only backend tests
      
      - name: Lint with flake8
        run: |
          flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Type check with mypy
        run: mypy backend --ignore-missing-imports --no-error-summary
        continue-on-error: true

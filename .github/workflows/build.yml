name: Build Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/agentos
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agentos-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agentos-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agentos-api:buildcache,mode=max
      
      - name: Build and push Worker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agentos-worker:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agentos-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agentos-worker:buildcache,mode=max
      
      - name: Build and push Scheduler image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.scheduler
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/agentos-scheduler:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agentos-scheduler:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/agentos-scheduler:buildcache,mode=max
